stages:
  - sync
  - test
  - lint
  - coverage
  - build
  - upload

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

.python_versions: &python_versions
  - PYTHON_IMAGE_VERSION: "3.10"
    TOX_ENV: "py310"
  - PYTHON_IMAGE_VERSION: "3.11"
    TOX_ENV: "py311"
  - PYTHON_IMAGE_VERSION: "3.12"
    TOX_ENV: "py312"
  - PYTHON_IMAGE_VERSION: "3.13"
    TOX_ENV: "py313"


.test_template: &test_definition
  stage: test
  script:
    - pip install poetry
    - poetry install
    - poetry run tox -e $TOX_ENV

copybara_sync:
  stage: sync
  image: eclipse-temurin:21-jdk
  before_script:
    - apt-get update
    - apt-get install -y curl git
    - git config --global user.name "Iman Shafiei"
    - git config --global user.email "iman.shafiei@earthdaily.com"
    - git config --global credential.helper store
    - echo "https://x-access-token:${GITHUB_PAT}@github.com" > ~/.git-credentials
  script:
    - echo "Downloading Copybara..."
    - curl -LO https://github.com/google/copybara/releases/download/v20250224/copybara_deploy.jar
    - echo "Running Copybara from $(pwd)..."
    - ls -la
    - java -jar copybara_deploy.jar copy.bara.sky local_test_sync --init-history

test:
  tags: [small]
  <<: *test_definition
  parallel:
    matrix: *python_versions
  image: python:${PYTHON_IMAGE_VERSION}

lint:
  tags: [small]
  stage: lint
  image: python:3.12
  script:
    - pip install poetry
    - poetry install
    - poetry run tox -e lint

coverage:
  tags: [small]
  stage: coverage
  image: python:3.12
  script:
    - pip install poetry
    - poetry install
    - poetry run tox -e coverage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build:
  tags: [small]
  stage: build
  parallel:
    matrix: *python_versions
  image: python:${PYTHON_IMAGE_VERSION}
  script:
    - pip install poetry
    - poetry build
  artifacts:
    paths:
      - dist/*

upload:
  tags: [small]
  stage: upload
  image: python:3.12
  before_script:
    - pip install poetry awscli
    - CODE_ARTIFACT_TOKEN=$(aws codeartifact get-authorization-token --domain urthecast --domain-owner ${FGPROD_ACCOUNT_ID} --query authorizationToken --output text --region us-east-1)
    - poetry config repositories.aws "https://urthecast-${FGPROD_ACCOUNT_ID}.d.codeartifact.us-east-1.amazonaws.com/pypi/pypi/"
    - poetry config http-basic.aws aws $CODE_ARTIFACT_TOKEN
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        poetry version $(poetry version -s).dev+${CI_COMMIT_SHORT_SHA}
      fi
    - poetry build
    - poetry publish -r aws
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
